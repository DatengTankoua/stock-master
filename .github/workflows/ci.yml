name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 1-22G : jeton en lecture seule ; aucun secret dans ce workflow (les pull
# requests, y compris de forks, n'exécutent que lint, tests et build).
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # 1-16G : ressources FR/EN (clés, variables, pluriels, rendu anglais sans
      # repli français) et inventaire des textes visibles non traduits.
      - run: pnpm test:i18n
      - run: pnpm i18n:coverage
      - run: pnpm build
      # 1-16C.2 : le texte servi des documents soumis à acceptation doit être
      # identique à l'archive de sa version (api/src/legal/archive), pour
      # chaque langue publiée (1-16G : rendu dynamique, `next start` lancé
      # par le script).
      - run: node scripts/legal-archive.mjs check --next-dir .next
